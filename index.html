  cardTitle:   "Download Proxy Server",

  accent:      "#6fd3b0",      // main soft accent colour

<style>
:root{
  --bg:#0d1b22; --bg2:#12272f; --card:rgba(255,255,255,.05); --line:rgba(255,255,255,.1);
  --text:#e6f1f3; --muted:#9db6bc; --accent:#6fd3b0; --btn-text:#06201a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){--bg:#eef5f4;--bg2:#dcebe8;--card:rgba(255,255,255,.7);--line:rgba(0,0,0,.08);--text:#17302e;--muted:#5b7773;--btn-text:#fff}
}
:root[data-theme="light"]{--bg:#eef5f4;--bg2:#dcebe8;--card:rgba(255,255,255,.7);--line:rgba(0,0,0,.08);--text:#17302e;--muted:#5b7773;--btn-text:#fff}
:root[data-theme="dark"]{--bg:#0d1b22;--bg2:#12272f;--card:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--text:#e6f1f3;--muted:#9db6bc;--btn-text:#06201a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--text);
  background:radial-gradient(900px 500px at 50% -10%,var(--bg2),var(--bg));background-color:var(--bg);text-align:center;overflow-x:hidden}
.progress{position:fixed;left:0;top:0;height:3px;width:0;background:var(--accent);z-index:20;transition:width .4s ease,opacity .4s}
.header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;padding:12px;font-size:13px;font-weight:600;letter-spacing:.14em;
  background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px 48px}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.reveal.in{opacity:1;transform:none}
h1{font-size:22px;font-weight:600;margin:0 0 8px}
.sub{margin:0 0 22px;color:var(--muted);font-size:14.5px;line-height:1.5}
.wave{display:inline-block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.video{position:relative;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line);
  box-shadow:0 10px 40px rgba(0,0,0,.25);transition:transform .4s ease,box-shadow .4s}
.video:hover{transform:translateY(-3px);box-shadow:0 16px 48px rgba(0,0,0,.3)}
.video video{width:100%;height:100%;display:block;object-fit:cover}
.card{margin:26px auto 0;padding:24px 20px;border-radius:22px;background:var(--card);border:1px solid var(--line);
  backdrop-filter:blur(8px);transform-style:preserve-3d;transition:transform .25s ease,box-shadow .3s,border-color .3s;will-change:transform}
.card:hover{border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 36px color-mix(in srgb,var(--accent) 18%,transparent)}
.icon{width:72px;height:72px;margin:0 auto;border-radius:18px;overflow:hidden;position:relative;
  background:linear-gradient(100deg,var(--line) 30%,rgba(255,255,255,.15) 50%,var(--line) 70%);background-size:200% 100%;animation:sh 1.4s infinite linear}
.icon.loaded{animation:none;background:none}
.icon img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s}
.icon.loaded img{opacity:1}
@keyframes sh{to{background-position:-200% 0}}
.card h2{margin:16px 0 4px;font-size:18px;font-weight:600}
.card p{margin:0;color:var(--muted);font-size:14px}
.btn{position:relative;overflow:hidden;display:block;margin-top:20px;padding:15px;border-radius:999px;text-decoration:none;
  font-weight:700;font-size:16px;color:var(--btn-text);background:var(--accent);
  box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .2s ease,box-shadow .3s,filter .3s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 10px 28px color-mix(in srgb,var(--accent) 45%,transparent)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--text);outline-offset:3px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none}
@keyframes rp{to{transform:scale(3);opacity:0}}
.theme{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:42px;height:42px;border-radius:50%;
  border:1px solid var(--line);background:var(--card);color:var(--text);font-size:18px;cursor:pointer;backdrop-filter:blur(8px);transition:transform .3s}
.theme:hover{transform:rotate(25deg) scale(1.08)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="progress" id="bar"></div>
<div class="header" id="hdr"></div>
<main class="wrap">
  <h1 class="reveal"><span id="hd"></span> <span class="wave" id="em"></span></h1>
  <p class="sub reveal" id="sub"></p>
  <div class="video reveal" id="vbox"></div>
  <section class="card reveal" id="card">
    <div class="icon" id="icon"><img id="cimg" alt="" loading="lazy" decoding="async"></div>
    <h2 id="ct"></h2>
    <p id="cs"></p>
    <a class="btn" id="btn" rel="noopener"></a>
  </section>
</main>
<button class="theme" id="tg" aria-label="Toggle theme">◐</button>
<script>
(function(){
  const C=CONFIG,$=id=>document.getElementById(id),root=document.documentElement;
  document.title=C.pageTitle;
  root.style.setProperty('--accent',matchMedia('(prefers-color-scheme:light)').matches?C.accentDark:C.accent);
  $('hdr').textContent=C.headerText; $('hd').textContent=C.heading; $('em').textContent=C.headingEmoji;
  $('sub').textContent=C.subheading; $('ct').textContent=C.cardTitle; $('cs').textContent=C.cardSubtitle;
  const b=$('btn'); b.textContent=C.buttonText; b.href=C.buttonLink;

  // light-weight video: nothing heavy loads until the viewer presses play
  const v=document.createElement('video');
  v.controls=true; v.playsInline=true; v.preload='none'; if(C.videoPoster)v.poster=C.videoPoster;
  v.src=C.videoSrc; $('vbox').appendChild(v);

  // image with skeleton shimmer
  const im=$('cimg'); im.onload=()=>$('icon').classList.add('loaded'); im.src=C.cardImage;
  if(im.complete&&im.naturalWidth)im.onload();

  // smooth reveal on scroll
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
  document.querySelectorAll('.reveal').forEach((el,i)=>{el.style.transitionDelay=(i*90)+'ms';io.observe(el)});

  // slim load bar
  const bar=$('bar'); bar.style.width='70%';
  addEventListener('load',()=>{bar.style.width='100%';setTimeout(()=>bar.style.opacity=0,400)});

  // gentle card tilt (pointer devices only)
  const card=$('card');
  if(matchMedia('(hover:hover)').matches){
    card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
      card.style.transform=`perspective(700px) rotateX(${-y*5}deg) rotateY(${x*5}deg)`});
    card.addEventListener('pointerleave',()=>card.style.transform='');
  }

  // button ripple
  b.addEventListener('pointerdown',e=>{const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement('span');
    d.className='rip';d.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;
    b.appendChild(d);setTimeout(()=>d.remove(),600)});

  // theme toggle
  $('tg').onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==='dark':!matchMedia('(prefers-color-scheme:light)').matches;
    root.dataset.theme=dark?'light':'dark';root.style.setProperty('--accent',dark?C.accentDark:C.accent)};
})();
</script>
</body>
</html>
